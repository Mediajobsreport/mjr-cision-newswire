name: Refresh MJR Prep Headlines Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    paths:
      - "scripts/update-headlines-cache.js"
      - ".github/workflows/update-headlines-cache.yml"

permissions:
  contents: write

concurrency:
  group: mjr-prep-headlines-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch and cache current headlines
        run: node scripts/update-headlines-cache.js
      - name: Publish updated JSON
        run: |
          git config user.name "MJR Headlines Cache"
          git config user.email "actions@users.noreply.github.com"
          git add data/headlines/all.json data/headlines/entertainment.json
          if git diff --cached --quiet; then
            echo "Headline cache is unchanged."
          else
            git commit -m "Refresh Prep headlines cache"
            git push
          fi
