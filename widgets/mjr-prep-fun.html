<script>
(function(){'use strict';var fortune=document.getElementById('mjr-fortune');if(!fortune||document.getElementById('mjr-compliment'))return;var box=document.createElement('div');box.id='mjr-compliment';box.setAttribute('aria-live','polite');box.style.cssText='font:700 16px/1.4 Roboto,Arial,sans-serif;text-align:center;margin:18px 0;color:inherit';fortune.insertAdjacentElement('afterend',box);var last='',request=0;function check(){var date=fortune.getAttribute('data-prep-date');if(!date||date===last)return;last=date;var current=++request;box.textContent='';var h=document.createElement('div');h.style.cssText='font-weight:700;text-decoration:underline;margin-bottom:10px';h.textContent='😊 Compliment Of The Day — '+new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});box.appendChild(h);var p=document.createElement('p');p.style.cssText='font-weight:700;margin:5px 0';p.textContent='Loading today’s compliment…';box.appendChild(p);fetch('https://raw.githubusercontent.com/Mediajobsreport/mjr-cision-newswire/main/data/compliments.json?day='+date,{signal:AbortSignal.timeout(12000)}).then(function(r){if(!r.ok)throw Error('Unavailable');return r.json();}).then(function(data){if(current!==request)return;if(!data.days||!data.days[date])throw Error('No saved compliment');p.textContent='“'+data.days[date]+'”';box.setAttribute('data-prep-date',date);}).catch(function(){if(current===request)p.textContent='The compliment for this Prep date is not available yet.';});}new MutationObserver(check).observe(fortune,{attributes:true,attributeFilter:['data-prep-date']});check();})();

<script>
(function(){
'use strict';
var base='https://raw.githubusercontent.com/Mediajobsreport/mjr-cision-newswire/main/data/prep-fun.json';
var date='',payload=null,pending=null,serial=0;
function node(tag,text,cls){var e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}
var css=node('style');css.textContent='.mjr-prep-feature{font:700 16px/1.5 Roboto,Arial,sans-serif;text-align:center;margin:22px 0;color:inherit}.mjr-prep-feature h3{font:700 16px/1.4 Roboto,Arial,sans-serif;text-decoration:underline;margin:0 0 10px;color:inherit}.mjr-prep-feature p{font-weight:700;margin:6px 0}.mjr-prep-eight-form{display:flex;justify-content:center;gap:8px;max-width:640px;margin:12px auto;flex-wrap:wrap}.mjr-prep-eight-form input{font:400 16px Roboto,Arial,sans-serif;flex:1 1 250px;min-width:0;padding:10px 12px;border:1px solid #b7c4d1;border-radius:5px;color:#172b4d;background:#fff}.mjr-prep-eight-form button{font:700 16px Roboto,Arial,sans-serif;padding:10px 18px;border:0;border-radius:5px;background:#1b2c56;color:white;cursor:pointer}.mjr-prep-eight-form button:disabled{opacity:.6;cursor:wait}.mjr-prep-eight-form input:focus-visible,.mjr-prep-eight-form button:focus-visible{outline:3px solid #50a7d0;outline-offset:2px}.mjr-prep-eight-answer{min-height:28px;color:#183b61}';document.head.appendChild(css);
function block(id,title,category){var e=node('section','', 'mjr-prep-feature');e.id=id;e.dataset.category=category;var h=node('h3',title);e.append(h);var p=node('p','Loading today’s selection…');p.className='mjr-prep-daily-value';p.setAttribute('aria-live','polite');e.append(p);return e;}
function mount(){
var trivia=document.getElementById('bdai-trivia-fun'),talk=document.getElementById('bdai-talk-debate-play'),fortune=document.getElementById('mjr-compliment')||document.getElementById('mjr-fortune');
if(trivia&&!document.getElementById('mjr-prep-trivia-extras')){var group=node('div');group.id='mjr-prep-trivia-extras';group.append(block('mjr-prep-fact','💡 Random Fact Of The Day','fact'),block('mjr-prep-dad-joke','😄 Dad Joke Of The Day','dad-joke'));var eight=node('section','', 'mjr-prep-feature');eight.id='mjr-prep-eight';eight.append(node('h3','🎱 Magic 8 Ball'),node('p','Ask a yes-or-no question and let the Magic 8 Ball decide.'));var form=node('form','', 'mjr-prep-eight-form'),input=node('input');input.type='text';input.maxLength=240;input.required=true;input.id='mjr-eight-question';input.setAttribute('aria-label','Your yes-or-no question');input.placeholder='Will today be a good day?';var button=node('button','Ask the 8 Ball');button.type='submit';form.append(input,button);var answer=node('p','', 'mjr-prep-eight-answer');answer.setAttribute('role','status');answer.setAttribute('aria-live','polite');eight.append(form,answer);form.addEventListener('submit',async function(event){event.preventDefault();if(!input.value.trim()){input.setCustomValidity('Enter a yes-or-no question.');input.reportValidity();return;}input.setCustomValidity('');button.disabled=true;answer.textContent='The 8 Ball is thinking…';try{var r=await fetch('https://dumbapis.com/magic-8-ball',{signal:AbortSignal.timeout(12000),cache:'no-store'});if(!r.ok)throw Error('Unavailable');var data=await r.json();if(typeof data.answer!=='string'||!data.answer.trim())throw Error('No answer');answer.textContent='🎱 '+data.answer;}catch(e){answer.textContent='The 8 Ball is resting. Please try again in a moment.';}finally{button.disabled=false;}});input.addEventListener('input',function(){input.setCustomValidity('');});group.append(eight);trivia.insertAdjacentElement('afterend',group);}
if(talk&&!document.getElementById('mjr-prep-rather'))talk.insertAdjacentElement('afterend',block('mjr-prep-rather','🤔 Would You Rather?','would-you-rather'));
if(fortune&&!document.getElementById('mjr-prep-excuse'))fortune.insertAdjacentElement('afterend',block('mjr-prep-excuse','🙃 Excuse Of The Day','excuse'));
}
function render(){if(!date||!payload)return;document.querySelectorAll('.mjr-prep-feature[data-category]').forEach(function(e){var values=payload.categories&&payload.categories[e.dataset.category];var value=values&&values.days&&values.days[date];e.querySelector('.mjr-prep-daily-value').textContent=value||'The selection for this Prep date is not available yet.';e.dataset.prepDate=date;});}
function check(){mount();var f=document.getElementById('mjr-fortune'),next=f&&f.getAttribute('data-prep-date');if(!next)return;if(date===next){render();return;}date=next;var current=++serial;payload=null;pending=fetch(base+'?date='+date,{signal:AbortSignal.timeout(12000),cache:'no-store'}).then(function(r){if(!r.ok)throw Error('Unavailable');return r.json();}).then(function(d){if(current!==serial)return;payload=d;render();}).catch(function(){if(current!==serial)return;document.querySelectorAll('.mjr-prep-daily-value').forEach(function(p){p.textContent='Today’s selection could not load. Please reload in a moment.';});});}
mount();var fortune=document.getElementById('mjr-fortune');if(fortune)new MutationObserver(check).observe(fortune,{attributes:true,attributeFilter:['data-prep-date']});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',check,{once:true});check();
})();
</script>
