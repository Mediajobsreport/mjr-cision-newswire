<script>
(function(){
'use strict';var current='',serial=0;
function create(){if(document.getElementById('mjr-faith-section'))return;var talk=document.getElementById('bdai-talk-debate-play'),recipe=document.getElementById('bdai-food-recipes'),survey=document.getElementById('mjrSurveyWrap');if(!talk)return;var section=document.createElement('section');section.id='mjr-faith-section';section.setAttribute('aria-label','Faith and Inspiration');var divider=document.createElement('p');divider.id='bdai-faith-inspiration';divider.className='bdai-framework-divider';var strong=document.createElement('strong');strong.textContent='📖 FAITH & INSPIRATION';divider.appendChild(strong);var body=document.createElement('div');body.id='mjr-verse-of-day';body.style.cssText='font:700 16px/1.5 Roboto,Arial,sans-serif;text-align:center;margin:22px auto 28px;max-width:1000px;padding:0 14px';var heading=document.createElement('h3');heading.id='mjr-verse-heading';heading.style.cssText='font:700 16px/1.4 Roboto,Arial,sans-serif;text-decoration:underline;margin:0 0 12px;color:inherit';heading.textContent='Verse Of The Day';var text=document.createElement('p');text.id='mjr-verse-text';text.style.cssText='font-weight:700;margin:8px 0';text.setAttribute('aria-live','polite');text.textContent='Reading the Prep date…';var ref=document.createElement('p');ref.id='mjr-verse-reference';ref.style.cssText='font-weight:700;margin:8px 0';var credit=document.createElement('p');credit.style.cssText='font-size:12px;margin:8px 0;font-weight:400';var a=document.createElement('a');a.href='https://bible-api.com/';a.textContent='World English Bible · Bible-API.com';a.target='_blank';a.rel='noopener noreferrer';credit.appendChild(a);body.append(heading,text,ref,credit);section.append(divider,body);if(recipe)recipe.insertAdjacentElement('beforebegin',section);else if(survey)survey.insertAdjacentElement('afterend',section);else{var closing=document.getElementById('bdai-closing-thought');if(closing)closing.insertAdjacentElement('beforebegin',section);else talk.insertAdjacentElement('afterend',section);}var foodLink=document.querySelector('.bdai-jump-links a[href="#bdai-food-recipes"]');if(foodLink&&!document.querySelector('.bdai-jump-links a[href="#bdai-faith-inspiration"]')){var nav=document.createElement('a');nav.className='bdai-jump-link';nav.href='#bdai-faith-inspiration';nav.textContent='Faith & Inspiration';foodLink.insertAdjacentElement('beforebegin',nav);}}
async function check(){create();var root=document.getElementById('mjr-verse-of-day'),fortune=document.getElementById('mjr-fortune'),date=fortune&&fortune.getAttribute('data-prep-date');if(!root||!date||date===current)return;current=date;var id=++serial;document.getElementById('mjr-verse-heading').textContent='Verse Of The Day — '+new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});var text=document.getElementById('mjr-verse-text'),ref=document.getElementById('mjr-verse-reference');text.textContent='Loading today’s verse…';ref.textContent='';try{var response=await fetch('https://raw.githubusercontent.com/Mediajobsreport/mjr-cision-newswire/main/data/daily-verses.json?date='+date,{signal:AbortSignal.timeout(12000),cache:'no-store'});if(!response.ok)throw Error('Verse unavailable');var data=await response.json(),verse=data.days&&data.days[date];if(id!==serial)return;if(!verse||verse.translation_id!=='web'||!verse.text||!verse.reference)throw Error('No saved WEB verse');text.textContent='“'+verse.text+'”';ref.textContent=verse.reference+' (WEB)';root.setAttribute('data-prep-date',date);}catch(e){if(id===serial)text.textContent='The verse for this Prep date is not available yet.';}}
var fortune=document.getElementById('mjr-fortune');if(fortune)new MutationObserver(check).observe(fortune,{attributes:true,attributeFilter:['data-prep-date']});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',check,{once:true});check();
})();
</script>
